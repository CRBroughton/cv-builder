services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cv_builder:cv_builder@db:5432/cv_builder
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: cv_builder
      POSTGRES_DB: cv_builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
