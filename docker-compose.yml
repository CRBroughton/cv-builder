services:
  app:
    image: cv-builder:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cv_builder:cv_builder@db:5432/cv_builder
    volumes:
      - ./app:/app/app:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - uv-venv:/app/.venv
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: cv_builder
      POSTGRES_DB: cv_builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh

volumes:
  pgdata:
  uv-venv:
